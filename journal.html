<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forex Trading Journal</title>

<link rel="stylesheet" href="./journal.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header class="navbar">

<div class="logo">
Trading Journal
</div>
<!-- <button id="themeToggle">Toggle Theme</button> -->
<button id="logoutBtn">
Logout
</button>


</header>

<section class="section">

<div class="container">

<h1 class="section-title">
Trading Dashboard
</h1>

</div>

</section>

<section class="section">

<div class="container">

<div class="stats-grid">

<div class="stat-card">

<h2 id="totalTrades">
0
</h2>

<p>Total Trades</p>

</div>

<div class="stat-card">

<h2 id="wins">
0
</h2>

<p>Wins</p>

</div>

<div class="stat-card">

<h2 id="losses">
0
</h2>

<p>Losses</p>

</div>

<div class="stat-card">

<h2 id="winRate">
0%
</h2>

<p>Win Rate</p>

</div>

</div>

</div>

</section>

<section class="section">

<div class="container">

<div class="about-card">

<h2>Add Trade</h2>

<br>

<form id="tradeForm">

<input
type="text"
id="pair"
placeholder="PAIRS"
required>

<br><br>

<select id="direction">

<option class="buy">BUY</option>
<option class="sell">SELL</option>

</select>

<br><br>

<input
type="number"
step="0.0001"
id="entry"
placeholder="Entry Price"
required>

<br><br>

<input
type="number"
step="0.0001"
id="sl"
placeholder="Stop Loss"
required>

<br><br>

<input
type="number"
step="0.0001"
id="tp"
placeholder="Take Profit"
required>

<br><br>

<select id="result">

<option class="win">Win</option>
<option class="loss">Loss</option>

</select>

<br><br>

<input
type="file"
id="screenshot">

<br><br>

<button type="submit">

Save Trade

</button>

</form>

</div>

</div>

</section>

<section class="section">

<div class="container">

<div class="about-card">

<h2>Risk Reward Calculator</h2>

<br>

<input
type="number"
id="rrEntry"
placeholder="Entry">

<br><br>

<input
type="number"
id="rrSL"
placeholder="Stop Loss">

<br><br>

<input
type="number"
id="rrTP"
placeholder="Take Profit">

<br><br>

<button id="calculateRR">

Calculate RR

</button>

<br><br>

<h3 id="rrResult">
1 : 0
</h3>

</div>

</div>

</section>

<section class="section">

<div class="container">

<div class="about-card">

<h2>Performance Chart</h2>

<br>

<canvas
id="equityChart">

</canvas>

</div>

</div>

</section>

<section class="section">

<div class="container">

<div class="about-card">

<h2>Trade History</h2>

<br>
<table
id="tradeTable">

<thead>

<tr>

<th>Pair</th>
<th>Direction</th>
<th>Result</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</section>

<script type="module"
src="./firebase-config.js">
</script>

<script type="module"
src="./journal.js">
</script>

</body>
</html>
